# =============================================================================
# Inventra – Cloudflare Wrangler Configuration (feature/paywall-accounting)
#
# Separate deployment from production ("openstock", wrangler.toml, main branch).
# Own D1 database and KV namespace — fully isolated test data.
# =============================================================================

name = "inventra"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# Cloudflare Pages (Nuxt build output)
# =============================================================================
pages_build_output_dir = "dist"

# =============================================================================
# Environment Variables
# =============================================================================
# Secrets are NOT set here — set via `wrangler pages secret put <NAME> --project-name inventra`
# or the Cloudflare dashboard instead.

# =============================================================================
# D1 Database
# =============================================================================
# Created via: npx wrangler d1 create inventra-db
[[d1_databases]]
binding = "DB"
database_name = "inventra-db"
database_id = "c190722d-8fa5-4d20-8aa2-619ee7431150"
migrations_dir = "server/database/migrations"

# =============================================================================
# KV Namespace (Sessions / Cache)
# =============================================================================
# Created via: npx wrangler kv namespace create inventra_kv
[[kv_namespaces]]
binding = "KV"
id = "81d08f00a4cd460da69598f05b5bc4d7"
